name: Publish package

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Determine release version
        id: release_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Read Gradle project version
        id: gradle_version
        shell: bash
        run: |
          GRADLE_VERSION="$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"

          if [ -z "$GRADLE_VERSION" ]; then
            echo "No version=... found in gradle.properties"
            exit 1
          fi

          echo "version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Gradle version: $GRADLE_VERSION"

      - name: Verify release tag matches Gradle version
        shell: bash
        run: |
          RELEASE_VERSION="${{ steps.release_version.outputs.version }}"
          GRADLE_VERSION="${{ steps.gradle_version.outputs.version }}"

          if [ "$RELEASE_VERSION" != "$GRADLE_VERSION" ]; then
            echo "Version mismatch!"
            echo "Release tag version: $RELEASE_VERSION"
            echo "gradle.properties version: $GRADLE_VERSION"
            exit 1
          fi

          if [[ "$GRADLE_VERSION" == *"-SNAPSHOT" ]]; then
            echo "Release version must not be a SNAPSHOT version: $GRADLE_VERSION"
            exit 1
          fi

          echo "Version check passed: $RELEASE_VERSION"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew clean build

      - name: Publish to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
